<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>oh-my-comic</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="mobile-body">

  <!-- Header -->
  <header class="mobile-header">
    <h1 id="story-title">oh-my-comic</h1>
    <div class="header-right">
      <!-- Creative mode toggle -->
      <label class="creative-toggle" id="creative-toggle-label" title="创作模式：开启后连续写文本，关闭后统一生图">
        <input type="checkbox" id="creative-mode-checkbox" onchange="onCreativeModeChange(this)" />
        <span class="creative-toggle-track">
          <span class="creative-toggle-thumb"></span>
        </span>
        <span class="creative-toggle-text" id="creative-toggle-text">创作模式</span>
      </label>
      <div id="header-status" class="header-status"></div>
    </div>
  </header>

  <!-- Story Content -->
  <main id="story-container" class="story-container">
    <div id="segments-list" class="segments-list">
      <!-- Segments injected by JS -->
    </div>
    <div id="empty-hint" class="empty-hint">
      <div class="empty-icon">📖</div>
      <p>故事还没有开始。</p>
      <p>在下方输入你希望故事如何开始，然后点击「生成」。</p>
    </div>
  </main>

  <!-- Status Bar -->
  <div id="status-bar" class="status-bar status-info">
    <span id="status-text">正在连接服务器...</span>
  </div>

  <!-- Input Area -->
  <footer id="input-area" class="input-area">
    <!-- Image preview (shown when an image is selected) -->
    <div id="image-preview-area" class="image-preview-area hidden">
      <img id="image-preview-thumb" class="image-preview-thumb" src="" alt="预览" />
      <span id="image-preview-name" class="image-preview-name"></span>
      <button class="image-remove-btn" onclick="removeSelectedImage()" title="移除图片">✕</button>
    </div>

    <div class="input-row">
      <!-- Image upload button -->
      <label class="upload-btn" id="upload-btn-label" title="上传图片（最多 1 张）">
        <input type="file" id="image-file-input" accept="image/*" style="display:none"
               onchange="onImageSelected(this)" />
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
      </label>

      <textarea
        id="direction-input"
        class="direction-input"
        placeholder="输入你希望下一段故事如何发展..."
        rows="2"
      ></textarea>
      <button id="generate-btn" class="generate-btn" onclick="sendGenerate()">
        <span id="btn-text">生成</span>
        <span id="btn-spinner" class="spinner hidden"></span>
      </button>
    </div>
    <div id="serve-only-hint" class="serve-only-hint hidden">
      当前为只读模式，无法生成新内容。
    </div>
  </footer>

  <script src="/static/js/mobile.js"></script>
</body>
</html>
