<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>oh-my-comic</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="mobile-body">

  <!-- Header -->
  <header class="mobile-header">
    <h1 id="story-title">oh-my-comic</h1>
    <div class="header-right">
      <!-- Creative mode toggle / 创作模式开关 -->
      <label class="creative-toggle" id="creative-toggle-label" title="" style="display:none">
        <input type="checkbox" id="creative-mode-checkbox" onchange="onCreativeModeChange(this)" />
        <span class="creative-toggle-track">
          <span class="creative-toggle-thumb"></span>
        </span>
        <span class="creative-toggle-text" id="creative-toggle-text"></span>
      </label>
    </div>
  </header>

  <!-- Story Content -->
  <main id="story-container" class="story-container">
    <div id="segments-list" class="segments-list">
      <!-- Segments injected by JS -->
    </div>

    <!-- Empty state: starter entry + normal hint -->
    <div id="empty-hint" class="empty-hint">
      <!-- Quick Start entry card — shown when story is empty -->
      <div id="starter-entry" class="starter-entry" onclick="openStarterWizard()">
        <div class="starter-entry-icon">✨</div>
        <div class="starter-entry-title" id="starter-entry-title"></div>
        <div class="starter-entry-subtitle" id="starter-entry-subtitle"></div>
      </div>

      <!-- Starter wizard panel — shown after clicking the entry -->
      <div id="starter-panel" class="starter-panel hidden">
        <div id="starter-questions-container" class="starter-questions-container"></div>
        <button id="starter-submit-btn" class="starter-submit-btn" onclick="submitStarterAnswers()" disabled></button>
        <button class="starter-cancel-btn" onclick="closeStarterWizard()">✕</button>
      </div>

      <!-- Normal empty hint text -->
      <div id="empty-text-hint" class="empty-text-hint">
        <div class="empty-icon">📖</div>
        <p id="empty-p1"></p>
        <p id="empty-p2"></p>
      </div>
    </div>
  </main>

  <!-- Status Bar -->
  <div id="status-bar" class="status-bar status-info">
    <span id="status-text"></span>
  </div>

  <!-- Input Area -->
  <footer id="input-area" class="input-area">
    <!-- Image preview (shown when an image is selected) / 图片预览区域 -->
    <div id="image-preview-area" class="image-preview-area hidden">
      <img id="image-preview-thumb" class="image-preview-thumb" src="" alt="" />
      <span id="image-preview-name" class="image-preview-name"></span>
      <button class="image-remove-btn" onclick="removeSelectedImage()" title="✕">✕</button>
    </div>

    <div class="input-row">
      <!-- Image upload button / 图片上传按钮 -->
      <label class="upload-btn" id="upload-btn-label" title="">
        <input type="file" id="image-file-input" accept="image/*" style="display:none"
               onchange="onImageSelected(this)" />
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
      </label>

      <textarea
        id="direction-input"
        class="direction-input"
        placeholder=""
        rows="2"
      ></textarea>
      <button id="generate-btn" class="generate-btn" onclick="sendGenerate()">
        <span id="btn-text"></span>
        <span id="btn-spinner" class="spinner hidden"></span>
      </button>
    </div>
    <div id="serve-only-hint" class="serve-only-hint hidden">
    </div>
  </footer>

  <script src="/static/js/mobile.js"></script>
</body>
</html>
